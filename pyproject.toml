[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locro"
version = "0.1.0"
description = "Python wrapper for Chrome's screen-ai OCR (calls the DLL directly, no browser needed)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "Pillow",
    "PyMuPDF",
    "typer",
    "tqdm",
]

[project.scripts]
locro = "locro.cli:main"
